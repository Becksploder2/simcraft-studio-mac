name: Build Simcraft Mac Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CASCraftMac.swift'
      - 'SimcraftNative.swift'
      - 'Info.plist'
      - 'Build_on_Mac.command'
      - 'Resources/**'
      - '.github/workflows/main2.yml'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build restored Mac app
        shell: bash
        run: |
          chmod +x Build_on_Mac.command
          ./Build_on_Mac.command
          test -x 'Simscraft Studio.app/Contents/MacOS/SimscraftStudio'
      - name: Package portable app without DMG installer
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'Simscraft Studio.app' Simcraft-Studio-Mac-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Simcraft-Studio-Mac-Portable
          path: Simcraft-Studio-Mac-Portable.zip
          if-no-files-found: error
      - name: Publish portable update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view v1.0.10 >/dev/null 2>&1; then
            gh release create v1.0.10 Simcraft-Studio-Mac-Portable.zip --target "$GITHUB_SHA" --title "Simcraft Studio 1.0.10 Mac Portable Update" --notes "Native tabbed workspace and original CAS room background with capture safeguards. Portable ZIP, no installer."
          else
            gh release upload v1.0.10 Simcraft-Studio-Mac-Portable.zip --clobber
          fi
