<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simcraft — Release Candidate</title><style>body{margin:0;background:#101624;color:#e8ecf6;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px 26px;background:#192236;border-bottom:1px solid #36445d}h1{margin:0;font-size:23px}small,.muted{color:#a8b4ca}nav{display:flex;gap:6px;flex-wrap:wrap;overflow:auto;padding:12px 18px;background:#151e30;position:sticky;top:0;z-index:5}nav button{background:#24334c;border:1px solid #40516c;color:#fff;border-radius:8px;padding:11px;cursor:pointer;white-space:nowrap}nav button.active{background:#6e59c9}nav button:focus-visible{outline:3px solid #d0c5ff;outline-offset:2px}main{padding:24px;max-width:1250px;margin:auto}.panel{background:#1a2539;border:1px solid #34435c;border-radius:12px;padding:20px;margin-bottom:16px}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}label{display:block;margin:10px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{background:#101a2c;color:white;border:1px solid #465572;border-radius:7px;padding:9px;max-width:100%;box-sizing:border-box}button.action{background:#7561d8;color:white;border:0;border-radius:7px;padding:10px 15px;cursor:pointer;margin:8px 6px 8px 0}.chip{display:inline-flex;padding:7px 11px;background:#293954;border-radius:8px;margin:5px;gap:5px}.chip input{margin:0}.result{padding:12px;border-bottom:1px solid #384862}iframe{width:100%;height:78vh;border:0;border-radius:9px;background:white}img{max-width:100%;max-height:420px;object-fit:contain}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.two{grid-template-columns:1fr}}.hide{display:none}.tag{color:#b8a8ff}</style></head><body><header><h1>Simcraft Studio <span class="tag">5.4</span></h1><small>CAS workstation · player-controlled recommendations · offline workspace</small></header><nav id="nav" aria-label="Simcraft feature navigation"></nav><main id="main"></main><script>
const sections=['Character Studio','Hair & Glasses','Clothing SmartAssist','CC Library','Face Texture Studio','Glasses Creator','CAS Mod Studio','UV Face Alignment','Buildcraft','Settings'];const styles=['Sporty','Basics','Outdoorsy','Polished','Preppy','Rocker','Country','Hipster','Boho','Streetwear','Gamer','Gala','Africana'];let catalog=[],selectedStyles=new Set(['Preppy','Polished']),locks=new Set(),photoURL=null;let state={source:'both',occasion:'Everyday',glasses:'yes',hair:'Match reference',colors:'',search:''};const main=document.getElementById('main');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=(title,body)=>`<div class="panel"><h2>${title}</h2>${body}</div>`;const btn=(id,label)=>`<button class="action" id="${id}">${label}</button>`;function tab(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===name));let h='';if(name==='Character Studio'){h=p('Reference photo and SmartMorph',`<p>Load your reference image directly in SmartMorph below, then press the prominent ONE-SHOT button under the photo. This prepares an editable face plan; automatic in-game morphing is not yet supported.</p><input id="photo" type="file" accept="image/png,image/jpeg"><label><input id="enhance" type="checkbox"> Optional display sharpening (does not change original)</label><div id="preview"></div>`)+p('SmartMorph workspace',`<iframe title="SmartMorph" src="SmartMorph.html"></iframe>`)}else if(name==='UV Face Alignment'){h=p('UV Face Alignment',`<iframe title="UV Face Alignment" src="UVFaceAlign.html"></iframe>`)}else if(name==='Hair & Glasses'){h=p('Player preferences',`<label>Does your Sim wear glasses?</label><select id="glasses"><option value="yes">Yes</option><option value="sometimes">Sometimes</option><option value="no">No</option></select><label>Hair approach</label><select id="hair"><option>Match reference</option><option>Suggest flattering styles</option><option>Manual choice</option></select><label>Reference hair description (optional)</label><input id="hairDescription" placeholder="e.g. long platinum blonde straight center part">${btn('recommendHG','Suggest available hairstyles')}<div id="hgresults"></div>`)}else if(name==='Buildcraft'){h=p('Buildcraft — Coming Soon',`<div style="text-align:center;padding:55px 20px"><div style="font-size:56px">🏠</div><h2>Coming Soon</h2><p>AI-assisted floor plans, tile-grid layouts and Sims 4 building guides are planned for our first post-release update.</p><p class="muted">This preview is intentionally disabled in the launch release.</p></div>`)}else if(name==='Clothing SmartAssist'){h=p('Outfit preferences',`<p>Choose multiple Sims 4 style filters. Suggestions rank <b>imported catalog items</b>; no installed items are inferred without a catalog.</p><div id="styles">${styles.map(s=>`<label class="chip"><input type="checkbox" data-style="${s}" ${selectedStyles.has(s)?'checked':''}>${s}</label>`).join('')}</div><div class="row"><div><label>Outfit</label><select id="occasion">${['Everyday','Formal','Athletic','Sleep','Party','Swimwear','Hot Weather','Cold Weather'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Source</label><select id="source"><option value="both">Maxis + CC</option><option value="maxis">Maxis only</option><option value="cc">CC only</option></select></div><div><label>Preferred colors</label><input id="colors" placeholder="e.g. pink, black"></div></div>${btn('recommend','Recommend outfit')}${btn('exportPlan','Export outfit plan')}<div id="outfits"></div>`)}else if(name==='CC Library'){h=p('Import a CAS catalog',`<p>Import a JSON or CSV catalog of CAS items. Run the included <b>CCScanner.py</b> (or Scan-CC launcher) against your Mods folder, then import <b>Simcraft-CC-Catalog.json</b> here. The scanner reads package headers and infers possible categories from filenames; it does not yet parse CAS resources. Nothing is modified in your Mods folder.</p><input type="file" id="catalogFile" accept=".json,.csv,application/json,text/csv"> ${btn('sample','Download sample catalog')}<p class="muted">Fields: name, category, styles, source, colors, occasions, file. JSON may be an array or an object with an items array. CSV uses comma-separated columns; multi-value fields use |.</p><p id="catalogStatus">${catalog.length} catalog items loaded in this session.</p><div id="catalogList"></div>`)}else if(name==='Face Texture Studio'){h=p('Face Texture Lab',`<p>Manual artwork and UV alignment tools. Exports are drafts, not validated Sims 4 .package files.</p><div class="two"><div><h3>Texture Lab</h3><iframe src="FaceTextureLab.html" title="Face Texture Lab"></iframe></div><div><h3>UV Alignment</h3><iframe src="UVFaceAlign.html" title="UV Alignment"></iframe></div></div>`)}else if(name==='Glasses Creator'){h=p('Glasses design workspace',`<p>Adjustable 2D design prototype; game-ready 3D mesh export remains future work.</p><iframe src="GlassesCreator.html" title="Glasses Creator"></iframe>`)}else if(name==='CAS Mod Studio'){h=p('CAS Mod Studio',`<p>Existing package-header inspection and inventory tools. Editing CAS meshes and writing game-ready packages are not implemented.</p><iframe src="SmartAssist.html" title="CAS Mod Studio"></iframe>`)}else{h=p('Project Manager & status',`<p><b>Simcraft Release Candidate</b> — CAS workspace. Buildcraft is reserved for the first post-release update.</p><button id="saveProject">Export character project</button><label>Import saved project <input id="loadProject" type="file" accept=".json,application/json"></label><p class="muted">Saves preferences, selected styles, and catalog data. Reference photo files and iframe-specific editing states are not included.</p><p>Offline; no photo uploads to external AI services. Face matching, automatic game sculpting, package parsing and package creation are not functional yet.</p><p>Catalog data is held in memory for this session; export plans to save recommendations.</p>`)}main.innerHTML=h;wire(name);if(name==='Settings'){document.getElementById('saveProject').onclick=()=>download('Simcraft-Project.json',JSON.stringify({schema:1,app:'simcraft',state,catalog,styles:[...selectedStyles],locks:[...locks]},null,2));document.getElementById('loadProject').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let data=JSON.parse(await f.text());if(data.schema!==1||data.app!=='simcraft'||!Array.isArray(data.catalog)||data.catalog.length>50000||!Array.isArray(data.styles))throw Error('Invalid Simcraft project');catalog=data.catalog;state={...state,...data.state};selectedStyles=new Set(data.styles);locks=new Set(data.locks||[]);alert('Project settings and catalog restored. Reference photos must be reimported.')}catch(err){alert('Import failed: '+err.message)}}}}
function wire(name){if(name==='Character Studio'){document.getElementById('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);document.getElementById('preview').innerHTML=`<p>${esc(f.name)} — original retained</p><img id="photoPreview" src="${photoURL}">`};document.getElementById('enhance').onchange=e=>{let img=document.getElementById('photoPreview');if(img)img.style.filter=e.target.checked?'contrast(1.06) saturate(1.04)':'none'}}if(name==='Hair & Glasses'){document.getElementById('glasses').value=state.glasses;document.getElementById('hair').value=state.hair;document.getElementById('recommendHG').onclick=()=>{state.glasses=document.getElementById('glasses').value;state.hair=document.getElementById('hair').value;let items=catalog.filter(x=>/hair|glasses|eyewear/i.test(x.category||'')&&(state.glasses!=='no'||!/glasses|eyewear/i.test(x.category||'')));let terms=(document.getElementById('hairDescription').value||'').toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2);items=items.map(x=>({...x,score:terms.reduce((n,t)=>n+((JSON.stringify(x).toLowerCase().includes(t))?2:0),0)})).sort((a,b)=>b.score-a.score);document.getElementById('hgresults').innerHTML='<p class="muted">Catalog-only matches ranked by your written description. Photo-driven hair recognition and in-game application are not yet implemented.</p>'+renderItems(items,'No hair/glasses found in the imported catalog. Scan your Mods folder and import its catalog first.')}}if(name==='Clothing SmartAssist'){document.getElementById('occasion').value=state.occasion;document.getElementById('source').value=state.source;document.getElementById('colors').value=state.colors;document.querySelectorAll('[data-style]').forEach(e=>e.onchange=()=>{e.checked?selectedStyles.add(e.dataset.style):selectedStyles.delete(e.dataset.style)});document.getElementById('recommend').onclick=rank;document.getElementById('exportPlan').onclick=()=>download('SCS-outfit.json',JSON.stringify({styles:[...selectedStyles],...state,ranked:rank(true)},null,2));}if(name==='CC Library'){document.getElementById('catalogFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let raw=await f.text(),data=f.name.toLowerCase().endsWith('.csv')?parseCSV(raw):JSON.parse(raw);if(!Array.isArray(data))data=data.items;if(!Array.isArray(data))throw Error('Expected an array or {items:[]}');catalog=data.filter(x=>x&&typeof x==='object').map((x,i)=>({name:String(x.name||`Item ${i+1}`),category:String(x.category||''),styles:x.styles||[],source:String(x.source||'cc'),colors:x.colors||[],occasions:x.occasions||[],file:String(x.file||''),category_source:String(x.category_source||'catalog'),valid_dbpf:x.valid_dbpf}));document.getElementById('catalogStatus').textContent=`${catalog.length} catalog items loaded`;document.getElementById('catalogList').innerHTML=renderItems(catalog.slice(0,100),'No items');}catch(err){document.getElementById('catalogStatus').textContent='Import failed: '+err.message}};document.getElementById('sample').onclick=()=>download('SCS-sample.json',JSON.stringify([{name:'Sample black bob',category:'hair',styles:['Preppy'],source:'cc',colors:['black'],occasions:['Everyday']},{name:'Sample cardigan',category:'top',styles:['Preppy','Polished'],source:'maxis',colors:['pink'],occasions:['Everyday']}],null,2))}}
function arr(v){return Array.isArray(v)?v.map(String):String(v||'').split(/[|;]/).map(x=>x.trim()).filter(Boolean)}function score(x){let s=arr(x.styles).filter(v=>selectedStyles.has(v)).length*10;if(arr(x.occasions).some(v=>v.toLowerCase()===state.occasion.toLowerCase()))s+=7;if(state.colors&&arr(x.colors).some(v=>state.colors.toLowerCase().includes(v.toLowerCase())))s+=4;return s}function eligible(x){return state.source==='both'||String(x.source).toLowerCase()===state.source}function rank(returnData=false){state.occasion=document.getElementById('occasion').value;state.source=document.getElementById('source').value;state.colors=document.getElementById('colors').value;let clothing=catalog.filter(x=>eligible(x)&&!/hair|glasses|eyewear|face|skin|makeup/i.test(x.category)).sort((a,b)=>score(b)-score(a));if(returnData)return clothing.slice(0,30).map(x=>({...x,score:score(x)}));let groups=['top','bottom','fullbody','shoes','accessory'];let out=groups.map(g=>{let xs=clothing.filter(x=>{let c=x.category.toLowerCase();return g==='fullbody'?/dress|outfit|full.?body/.test(c):g==='shoes'?/shoe|boot/.test(c):g==='accessory'?/accessor|jewel|hat/.test(c):c.includes(g)});return `<h3>${g==='fullbody'?'Full-body outfit':g[0].toUpperCase()+g.slice(1)}</h3>${renderItems(xs.slice(0,5),'No matching items in catalog')}`}).join('');document.getElementById('outfits').innerHTML=out+(catalog.length?'':'<p class="muted">Import a catalog in the CC Library tab to get item-specific recommendations.</p>')}function renderItems(items,empty){return items.length?items.map(x=>`<div class="result"><b>${esc(x.name)}</b> <small>${esc(x.category)} · ${esc(x.source)}${x.category_source==='filename_guess'?' · category guessed from filename':''}${x.valid_dbpf===false?' · invalid DBPF header':''}${typeof x.score==='number'?' · '+x.score+' points':''}</small><div class="muted">${esc(arr(x.styles).join(', '))}</div></div>`).join(''):`<p class="muted">${empty}</p>`}function parseCSV(s){let lines=s.replace(/\r/g,'').split('\n').filter(Boolean);let cols=lines.shift().split(',').map(x=>x.trim());return lines.map(l=>{let v=l.split(',');let o={};cols.forEach((k,i)=>o[k]=['styles','colors','occasions'].includes(k)?(v[i]||'').split('|'):(v[i]||''));return o})}function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}sections.forEach(s=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>tab(s);document.getElementById('nav').appendChild(b)});tab('Character Studio');</script>
<style>
#sfh-stage{position:relative;display:inline-block;max-width:100%;margin:12px 0}#sfh-photo{display:block;max-height:450px;max-width:100%}#sfh-outline{position:absolute;border:3px solid #a99bff;border-radius:45%;box-shadow:0 0 0 9999px #0002;pointer-events:none;display:none}#sfh-stage:hover #sfh-outline{border-color:#6affd7}#sfh-pop{position:absolute;right:6px;bottom:6px;max-width:260px;background:#172139ee;padding:10px;border:1px solid #a99bff;border-radius:8px;display:none;z-index:3}#sfh-stage:hover #sfh-pop{display:block}#sfh-config{display:flex;flex-wrap:wrap;gap:12px}#sfh-config label{font-size:12px}#sfh-config input[type=range]{width:115px}#sfh-status{font-size:13px;color:#b8c8e5}
</style>
<script>
(function(){
let box,im,outline,pop,status,face={x:25,y:12,w:50,h:72},photo=null,chosen=null,gender='F',profiles=[];
const $=id=>document.getElementById(id);
function draw(){if(!outline)return;Object.assign(outline.style,{display:'block',left:face.x+'%',top:face.y+'%',width:face.w+'%',height:face.h+'%'});for(let k of ['x','y','w','h']){let el=$('sfh-'+k);if(el)el.value=face[k]}}
function note(t){if(status)status.textContent=t}
function selectTemplate(n){chosen=gender+n; $('sfh-choice').textContent='Selected: '+chosen+' (in Simcraft only)';}
function suggest(){let matches=profiles.filter(v=>v.gender===gender&&Number.isInteger(v.number)&&v.number>=1&&v.number<=19&&Array.isArray(v.landmarks));if(!matches.length){$('sfh-recommend').textContent='No verified match yet. Import calibrated template measurements to enable automatic ranking.';return;} $('sfh-recommend').textContent='Template profiles loaded, but photo landmarks must be measured by a compatible face engine before matching. Manual selection remains available.'}
async function analyze(){if(!photo)return; if(!('FaceDetector' in window)){note('Automatic face detection is unavailable in this browser/webview. Adjust the face outline manually.');return;}try{const detector=new FaceDetector({fastMode:true,maxDetectedFaces:5});let faces=await detector.detect(im);if(!faces.length){note('No face detected. Adjust the outline manually.');return;}let r=faces[0].boundingBox;let sx=100/im.naturalWidth,sy=100/im.naturalHeight;face={x:Math.max(0,r.x*sx),y:Math.max(0,r.y*sy),w:Math.min(100,r.width*sx),h:Math.min(100,r.height*sy)};draw();note('Face detected. Hover over the outlined face to view template options.');}catch(e){note('Face detector could not run; use manual outline. '+e.message)}}
function mount(){let preview=$('preview');if(!preview||$('sfh-root'))return;let root=document.createElement('div');root.id='sfh-root';root.className='panel';root.innerHTML=`<h3>Smart Face Hover</h3><p class="muted">Load a photo above, then hover over the face. Detection is attempted locally when supported; otherwise adjust the outline. No guessed template scores.</p><label>Template gallery <select id="sfh-gender"><option value="F">Female (F1–F19)</option><option value="M">Male (M1–M19)</option></select></label><div id="sfh-stage"><img id="sfh-photo" alt="Reference face"><div id="sfh-outline"></div><div id="sfh-pop"><b>Face hover</b><p id="sfh-recommend">Import measured template profiles to enable matching.</p><label>Choose template <select id="sfh-template"></select></label><button class="action" id="sfh-choose">Select in Simcraft</button></div></div><div id="sfh-status" role="status">Waiting for photo.</div><div id="sfh-config"></div><p id="sfh-choice">No template selected</p><label>Optional calibrated profiles JSON <input type="file" id="sfh-profiles" accept="application/json,.json"></label><p class="muted">Apply in CAS is not available: this build does not control The Sims 4. Imported profiles alone do not provide photo landmark matching.</p>`;preview.after(root);box=$('sfh-stage');im=$('sfh-photo');outline=$('sfh-outline');pop=$('sfh-pop');status=$('sfh-status');im.style.display='none';outline.style.display='none';let cfg=$('sfh-config');for(let k of ['x','y','w','h']){let label=document.createElement('label');label.textContent=({x:'Left',y:'Top',w:'Width',h:'Height'})[k]+' ';let inp=document.createElement('input');inp.type='range';inp.id='sfh-'+k;inp.min=0;inp.max=100;inp.value=face[k];inp.oninput=()=>{face[k]=Number(inp.value);draw()};label.append(inp);cfg.append(label)}function populate(){let s=$('sfh-template');s.innerHTML='';for(let i=1;i<=19;i++){let opt=document.createElement('option');opt.value=i;opt.textContent=gender+i;s.append(opt)}suggest()}$('sfh-gender').onchange=e=>{gender=e.target.value;populate()};$('sfh-choose').onclick=()=>selectTemplate(Number($('sfh-template').value));$('sfh-profiles').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj))throw Error('Expected a JSON array');profiles=obj;note('Loaded '+obj.length+' template profiles.');suggest()}catch(err){note('Profile import failed: '+err.message)}};populate();let upload=$('photo');if(upload){upload.addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;if(photo)URL.revokeObjectURL(photo);photo=URL.createObjectURL(file);im.src=photo;im.style.display='block';await new Promise(r=>{im.onload=r;im.onerror=r});draw();analyze()})}}
let obs=new MutationObserver(()=>{if($('photo')&&!$('sfh-root'))mount()});obs.observe(document.body,{childList:true,subtree:true});mount();
})();
</script>
</body></html>
